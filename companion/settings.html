<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokeToken companion</title>
<style>
  :root { --bg: #f6f4ee; --fg: #23222a; --muted: #6b6a73; --card: #fff; --line: #d9d5ca; --accent: #d9382f; --ok: #2f7d4f; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #19181d; --fg: #ecebf0; --muted: #a09fa8; --card: #232228; --line: #3a3940; --ok: #6fcf97; --bad: #ff8a80; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 16px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  small { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=url], input[type=password], select { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .msg { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 20px 0 0; color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1>PokeToken companion</h1>
  <p class="lead">Sends the Pokémon PokeTokenBar is raising to your Home Quarters office, where it follows you.</p>
  {{if .Message}}<p class="msg {{if .OK}}ok{{else}}bad{{end}}" role="status">{{.Message}}</p>{{end}}
  <form method="post" action="/save">
    <input type="hidden" name="k" value="{{.Key}}">
    <label>Office address
      <input type="url" name="server" value="{{.Config.Server}}" placeholder="https://office.example.com" required>
    </label>
    <label>App token
      <input type="password" name="token" value="{{.Token}}" placeholder="{{if .HasToken}}Saved — leave empty to keep it{{else}}hqp_…{{end}}" autocomplete="off">
      <small>In the office: side panel &gt; Plugins &gt; PokeToken &gt; Create token.</small>
    </label>
    <label>Pokémon to show
      <select name="follow">
        <option value="active" {{if eq .Config.Follow "active"}}selected{{end}}>The one being raised (an egg before it hatches)</option>
        <option value="pinned" {{if eq .Config.Follow "pinned"}}selected{{end}}>The one pinned in PokeTokenBar, else the one being raised</option>
      </select>
    </label>
    <label>PokeTokenBar save
      <input type="text" name="savePath" value="{{.Config.SavePath}}" placeholder="{{if .Found}}{{.Found}}{{else}}Not found: give the path of companion-state.json{{end}}">
      <small>Leave empty to find it automatically.</small>
    </label>
    <div class="row">
      <button class="primary" type="submit">Save and send</button>
      <button type="submit" formaction="/test">Test the connection</button>
    </div>
  </form>
  <dl>
    <dt>Status</dt><dd>{{.Status}}</dd>
    <dt>Settings file</dt><dd>{{.ConfigDir}}</dd>
  </dl>
</main>
</body>
</html>
